name: PR Build Check

on:
  pull_request:
    branches:
      - '**'  # Sprawdza wszystkie branche

jobs:
  build-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Pobierz pełną historię dla lepszego cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (Check only)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Comment PR with build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const jobStatus = '${{ job.status }}';
            const isSuccess = jobStatus === 'success';
            const status = isSuccess ? '✅' : '❌';
            const buildResult = isSuccess ? 'Pomyślny' : 'Nieudany';
            const buildMessage = isSuccess 
              ? '✅ Build zakończony pomyślnie. Można mergować.' 
              : '❌ Build nieudany. Proszę sprawdzić błędy przed mergem.';
            
            const message = `## 🔨 Build Status: ${status}
            
            **Build Result:** ${buildResult}
            **Branch:** \`${{ github.head_ref }}\`
            **Commit:** \`${{ github.sha }}\`
            
            ${buildMessage}
            
            *Automatyczna wiadomość z GitHub Actions*
            `;
            
            // Znajdź istniejący komentarz od bota
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🔨 Build Status')
            );
            
            if (botComment) {
              // Aktualizuj istniejący komentarz
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              // Utwórz nowy komentarz
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }
