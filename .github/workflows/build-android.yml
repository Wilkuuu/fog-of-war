name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
      - dev
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate version info
        id: version
        run: |
          # Pobierz podstawową wersję z package.json
          BASE_VERSION=$(node -p "require('./package.json').version")
          
          # Pobierz informacje o branchu (dla PR użyj head ref, dla push użyj ref)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME=${GITHUB_HEAD_REF}
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
          fi
          BRANCH_NAME=${BRANCH_NAME//\//-}
          
          # Pobierz krótki hash commita
          COMMIT_HASH=$(git rev-parse --short HEAD)
          
          # Pobierz numer builda
          BUILD_NUMBER=${{ github.run_number }}
          
          # Określ czy to dev czy master
          if [[ "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" == "dev" ]]; then
            VERSION_NAME="${BASE_VERSION}-dev+build.${BUILD_NUMBER}.${COMMIT_HASH}"
            VERSION_SUFFIX="dev"
          elif [[ "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "main" ]]; then
            VERSION_NAME="${BASE_VERSION}+build.${BUILD_NUMBER}.${COMMIT_HASH}"
            VERSION_SUFFIX="master"
          else
            VERSION_NAME="${BASE_VERSION}-${BRANCH_NAME}+build.${BUILD_NUMBER}.${COMMIT_HASH}"
            VERSION_SUFFIX="${BRANCH_NAME}"
          fi
          
          # Version code jako run number * 1000 dla unikalności
          VERSION_CODE=$(( ${{ github.run_number }} * 1000 ))
          
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=${VERSION_SUFFIX}" >> $GITHUB_OUTPUT
          
          echo "Generated version: ${VERSION_NAME}"
          echo "Version code: ${VERSION_CODE}"
          echo "Branch: ${BRANCH_NAME}"
          echo "Event: ${{ github.event_name }}"

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace \
            -PVERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}" \
            -PVERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}" \
            -PBRANCH_NAME="${{ steps.version.outputs.BRANCH_NAME }}"

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace \
            -PVERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}" \
            -PVERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}" \
            -PBRANCH_NAME="${{ steps.version.outputs.BRANCH_NAME }}"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ steps.version.outputs.VERSION_SUFFIX }}-${{ steps.version.outputs.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          if-no-files-found: error

      - name: Upload Release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ steps.version.outputs.VERSION_SUFFIX }}-${{ steps.version.outputs.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release (on release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
