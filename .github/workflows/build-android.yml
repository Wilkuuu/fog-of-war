name: Build Android APK / AAB

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'release/**'
    tags:
      - 'v*'
      - 'latest'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Inject AdMob IDs from secrets
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_AD_UNIT_ID" ]; then
            echo "AdMob secrets missing — keeping repo defaults / test IDs"
            exit 0
          fi
          python3 <<'PY'
          import os, pathlib, re
          app_id = os.environ["ADMOB_APP_ID"]
          banner = os.environ["ADMOB_BANNER_AD_UNIT_ID"]

          cfg = pathlib.Path("src/app/services/monetization.config.ts")
          text = cfg.read_text()
          text = re.sub(
              r"androidAppId:\s*'[^']*'",
              f"androidAppId: '{app_id}'",
              text,
              count=1,
          )
          text = re.sub(
              r"(banner:\s*\{[^}]*production:\s*)'[^']*'",
              rf"\1'{banner}'",
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(r"useTestAds:\s*true", "useTestAds: false", text, count=1)
          cfg.write_text(text)

          strings = pathlib.Path("android/app/src/main/res/values/strings.xml")
          s = strings.read_text()
          if "admob_app_id" in s:
              s = re.sub(
                  r'(<string name="admob_app_id">)[^<]*(</string>)',
                  rf"\1{app_id}\2",
                  s,
                  count=1,
              )
          else:
              s = s.replace(
                  "</resources>",
                  f'    <string name="admob_app_id">{app_id}</string>\n</resources>',
              )
          strings.write_text(s)

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          # Prefer @string/admob_app_id; keep literal value rewrite as fallback
          if '@string/admob_app_id' not in m:
              m = re.sub(
                  r'(android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID"\s*\n\s*android:value=")[^"]*(")',
                  rf"\1{app_id}\2",
                  m,
              )
              manifest.write_text(m)
          print("Injected ADMOB_APP_ID and ADMOB_BANNER_AD_UNIT_ID")
          PY

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate version info
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_NUMBER=${{ github.run_number }}

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME=${GITHUB_HEAD_REF}
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/tags/}
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
          fi
          BRANCH_NAME=${BRANCH_NAME//\//-}

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION_NAME="${BASE_VERSION}-${TAG_NAME}+build.${BUILD_NUMBER}.${COMMIT_HASH}"
            VERSION_SUFFIX="${TAG_NAME}"
          elif [[ "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" == "dev" ]]; then
            VERSION_NAME="${BASE_VERSION}-dev+build.${BUILD_NUMBER}.${COMMIT_HASH}"
            VERSION_SUFFIX="dev"
          elif [[ "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "main" ]]; then
            VERSION_NAME="${BASE_VERSION}+build.${BUILD_NUMBER}.${COMMIT_HASH}"
            VERSION_SUFFIX="master"
          else
            VERSION_NAME="${BASE_VERSION}-${BRANCH_NAME}+build.${BUILD_NUMBER}.${COMMIT_HASH}"
            VERSION_SUFFIX="${BRANCH_NAME}"
          fi

          # Filesystem-safe version for artifact filenames
          FILE_VERSION=$(echo "${VERSION_NAME}" | sed 's/[+\/]/-/g; s/[^A-Za-z0-9._-]/-/g; s/--*/-/g')
          VERSION_CODE=$(( ${{ github.run_number }} * 1000 ))

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=${VERSION_SUFFIX}" >> $GITHUB_OUTPUT
          echo "FILE_VERSION=${FILE_VERSION}" >> $GITHUB_OUTPUT

          echo "Generated version: ${VERSION_NAME}"
          echo "File version: ${FILE_VERSION}"
          echo "Version code: ${VERSION_CODE}"

      - name: Decode upload keystore
        if: github.event_name != 'pull_request' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          sed -i 's/^[[:space:]]*//' android/keystore.properties

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace \
            -PVERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}" \
            -PVERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}" \
            -PBRANCH_NAME="${{ steps.version.outputs.BRANCH_NAME }}"

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace \
            -PVERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}" \
            -PVERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}" \
            -PBRANCH_NAME="${{ steps.version.outputs.BRANCH_NAME }}"

      - name: Build Release AAB
        if: github.event_name != 'pull_request'
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace \
            -PVERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}" \
            -PVERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}" \
            -PBRANCH_NAME="${{ steps.version.outputs.BRANCH_NAME }}"

      - name: Prepare versioned release artifacts
        if: github.event_name != 'pull_request'
        id: artifacts
        run: |
          mkdir -p release-artifacts
          FILE_VERSION="${{ steps.version.outputs.FILE_VERSION }}"

          APK_SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAB_SRC=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)

          APK_OUT="release-artifacts/fog-of-war-${FILE_VERSION}.apk"
          AAB_OUT="release-artifacts/fog-of-war-${FILE_VERSION}.aab"

          cp "$APK_SRC" "$APK_OUT"
          cp "$AAB_SRC" "$AAB_OUT"

          echo "APK_PATH=${APK_OUT}" >> $GITHUB_OUTPUT
          echo "AAB_PATH=${AAB_OUT}" >> $GITHUB_OUTPUT
          ls -lh release-artifacts/

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ steps.version.outputs.VERSION_SUFFIX }}-${{ steps.version.outputs.FILE_VERSION }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
          if-no-files-found: error

      - name: Upload Release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ steps.version.outputs.VERSION_SUFFIX }}-${{ steps.version.outputs.FILE_VERSION }}
          path: ${{ steps.artifacts.outputs.APK_PATH }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ steps.version.outputs.VERSION_SUFFIX }}-${{ steps.version.outputs.FILE_VERSION }}
          path: ${{ steps.artifacts.outputs.AAB_PATH }}
          retention-days: 30
          if-no-files-found: error

      # Only on tag *push* — do not run on release.published (avoids permission/race with existing release)
      - name: Create or update GitHub Release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.APK_PATH }}
            ${{ steps.artifacts.outputs.AAB_PATH }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }} (${{ steps.version.outputs.VERSION_NAME }})
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attach versioned artifacts to an already-published release
      - name: Upload artifacts to existing Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.APK_PATH }}
            ${{ steps.artifacts.outputs.AAB_PATH }}
          tag_name: ${{ github.event.release.tag_name }}
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
